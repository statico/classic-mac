<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executor</title>
<style>
  :root { --bg: #222; --fg: #ddd; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; max-width: 100vw; max-height: calc(100vh - 2em); outline: none; cursor: default; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #status { height: 2em; line-height: 2em; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="480" tabindex="0"></canvas>
<div id="status">Loading…</div>
<script>
// Games are emscripten file_packager bundles (games/<id>.js + .data), mounted at /games/<id>.
// See scripts/package-executor-game.sh and docs/executor-file-formats.md.
const GAMES = {
  // Scarab moves with the numeric keypad; send the arrow keys there too.
  'scarab-of-ra': { app: 'Scarab of RA 1.4/Scarab of RA 1.4', args: [],
                    keys: { ArrowUp: 'Numpad8', ArrowLeft: 'Numpad4', ArrowRight: 'Numpad6', ArrowDown: 'Numpad2' } },
  'simcity-2000': { app: 'SimCity 2000/SimCity2000™ 1.1', args: ['--applzone', '16M', '--bpp', '8'] },
  'dark-castle':  { app: 'Dark Castle/Dark Castle', args: ['--bpp', '1'] },
  'oregon-trail-cd': { app: 'Oregon Trail/Oregon Trail CD', parts: ['aa', 'ab', 'ac'], args: ['--bpp', '8'] },
  'shufflepuck-cafe': { app: 'Shufflepuck Cafe/Shufflepuck Cafe', args: ['--bpp', '1'] },
  'ev-nova': { app: 'EV Nova/EV Nova', parts: ['aa', 'ab', 'ac', 'ad'], args: ['--system', '8.1', '--applzone', '80M', '--bpp', '16', '--size', '800x600'] },
  // Glider 4 wants a 1-bit or 16-color screen.
  'glider-4': { app: 'Glider 4/Glider 4.06', args: ['--bpp', '4'] },
};
const params = new URLSearchParams(location.search);
const gameId = params.get('game') || 'scarab-of-ra';
const game = GAMES[gameId];
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');
let image = ctx.createImageData(canvas.width, canvas.height);

// Mac virtual key codes, keyed by KeyboardEvent.code.
const KEYS = {
  KeyA:0x00,KeyS:0x01,KeyD:0x02,KeyF:0x03,KeyH:0x04,KeyG:0x05,KeyZ:0x06,KeyX:0x07,KeyC:0x08,KeyV:0x09,
  KeyB:0x0B,KeyQ:0x0C,KeyW:0x0D,KeyE:0x0E,KeyR:0x0F,KeyY:0x10,KeyT:0x11,Digit1:0x12,Digit2:0x13,Digit3:0x14,
  Digit4:0x15,Digit6:0x16,Digit5:0x17,Equal:0x18,Digit9:0x19,Digit7:0x1A,Minus:0x1B,Digit8:0x1C,Digit0:0x1D,
  BracketRight:0x1E,KeyO:0x1F,KeyU:0x20,BracketLeft:0x21,KeyI:0x22,KeyP:0x23,Enter:0x24,KeyL:0x25,KeyJ:0x26,
  Quote:0x27,KeyK:0x28,Semicolon:0x29,Backslash:0x2A,Comma:0x2B,Slash:0x2C,KeyN:0x2D,KeyM:0x2E,Period:0x2F,
  Tab:0x30,Space:0x31,Backquote:0x32,Backspace:0x33,Escape:0x35,MetaLeft:0x37,MetaRight:0x37,ShiftLeft:0x38,
  ShiftRight:0x38,CapsLock:0x39,AltLeft:0x3A,AltRight:0x3A,ControlLeft:0x3B,ControlRight:0x3B,
  NumpadDecimal:0x41,NumpadMultiply:0x43,NumpadAdd:0x45,NumLock:0x47,NumpadDivide:0x4B,NumpadEnter:0x4C,
  NumpadSubtract:0x4E,NumpadEqual:0x51,Numpad0:0x52,Numpad1:0x53,Numpad2:0x54,Numpad3:0x55,Numpad4:0x56,
  Numpad5:0x57,Numpad6:0x58,Numpad7:0x59,Numpad8:0x5B,Numpad9:0x5C,F5:0x60,F6:0x61,F7:0x62,F3:0x63,F8:0x64,
  F9:0x65,F11:0x67,F10:0x6D,F12:0x6F,Home:0x73,PageUp:0x74,Delete:0x75,F4:0x76,End:0x77,F2:0x78,PageDown:0x79,
  F1:0x7A,ArrowLeft:0x7B,ArrowRight:0x7C,ArrowDown:0x7D,ArrowUp:0x7E,
};

// executor.js and executor.wasm must come from the same build, so caches key
// on this. scripts/build-executor-wasm.sh sets it to the wasm's md5.
const BUILD = '156a211c';
var Module = {
  arguments: [],
  locateFile: (f) => f.endsWith('.data') ? (dataURL || 'games/' + f) : f + '?v=' + BUILD,
  print: (t) => console.log(t),
  printErr: (t) => console.warn(t),
  setStatus: (t) => { status.textContent = t; },
  executorSetMode(w, h) {
    canvas.width = w; canvas.height = h;
    image = ctx.createImageData(w, h);
  },
  executorBlit(ptr, w, h) {
    if (image.width !== w || image.height !== h) image = ctx.createImageData(w, h);
    image.data.set(Module.HEAPU8.subarray(ptr, ptr + w * h * 4));
    ctx.putImageData(image, 0, 0);
  },
  // 8-bit unsigned mono buffers (wasm.cpp WasmSound). Stream 0 is the Sound
  // Manager mix, stream 1 the SoundBase hardware buffer; Web Audio mixes them.
  executorAudio(ptr, n, rate, stream) {
    const src = Module.HEAPU8.subarray(ptr, ptr + n);
    let level = 0;
    for (let i = 0; i < n; i++) level += Math.abs(src[i] - 128);
    Module.audioLevel = (Module.audioLevel || 0) + level; // read by the test harness
    Module.audioBuffers = (Module.audioBuffers || 0) + 1;
    if (!audio || audio.state !== 'running') return;
    const now = audio.currentTime;
    // Underrun: restart a little ahead. Overrun (emulator clock runs fast): drop.
    if (audioAt[stream] < now) audioAt[stream] = now + 0.1;
    else if (audioAt[stream] > now + 0.5) return;
    const buf = audio.createBuffer(1, n, rate);
    const out = buf.getChannelData(0);
    for (let i = 0; i < n; i++) out[i] = (src[i] - 128) / 128;
    const node = audio.createBufferSource();
    node.buffer = buf;
    node.connect(master);
    node.start(audioAt[stream]);
    audioAt[stream] += n / rate;
  },
  // SysBeep: a short square-wave beep, like the Simple Beep.
  executorBeep() {
    Module.beeps = (Module.beeps || 0) + 1;
    if (!audio || audio.state !== 'running') return;
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 880;
    gain.gain.value = 0.25;
    osc.connect(gain).connect(master);
    osc.start();
    osc.stop(audio.currentTime + 0.12);
  },
  executorExited() { status.textContent = 'Application quit.'; },
  onRuntimeInitialized() {
    status.textContent = gameId;
    canvas.focus();
    Module.callMain([...game.args, ...params.getAll('arg'), '/games/' + gameId + '/' + game.app]);
  },
};

// Browsers start audio only after a user gesture. The click on the site's
// game link counts (the iframe has allow="autoplay"), so try at load too.
let audio = null, master = null, audioAt = [0, 0];
function startAudio() {
  if (!audio) {
    audio = new AudioContext();
    master = audio.createGain();
    master.gain.value = 0.5; // full-scale 8-bit Mac samples are loud
    master.connect(audio.destination);
  }
  if (audio.state !== 'running') audio.resume().catch(() => {});
}
// iPhone mutes web audio when the ring switch is on silent, unless the page
// says it plays media.
if (navigator.audioSession) navigator.audioSession.type = 'playback';
startAudio();
// Safari starts audio only from some events (touchend, click), Chrome from others.
for (const t of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'])
  addEventListener(t, startAudio, { capture: true, passive: true });

function macPoint(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.round((e.clientX - r.left) * canvas.width / r.width),
          Math.round((e.clientY - r.top) * canvas.height / r.height)];
}
// Pointer events cover mouse, pen and touch. touch-action: none (CSS) stops a
// finger drag from scrolling the page, so it drags in the Mac instead.
canvas.addEventListener('pointermove', (e) => { if (Module._executor_mouse_moved) Module._executor_mouse_moved(...macPoint(e)); });
canvas.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary || !Module._executor_mouse_button) return;
  canvas.focus();
  canvas.setPointerCapture(e.pointerId);
  // A tap has no hover, so move the Mac mouse there before the click.
  Module._executor_mouse_moved(...macPoint(e));
  Module._executor_mouse_button(1, ...macPoint(e));
  e.preventDefault();
});
for (const type of ['pointerup', 'pointercancel'])
  canvas.addEventListener(type, (e) => { if (e.isPrimary && Module._executor_mouse_button) Module._executor_mouse_button(0, ...macPoint(e)); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
// Sends one key to the Mac. code is a KeyboardEvent.code. The site's
// on-screen keys call this too (same origin). Returns false for unknown keys.
window.macKey = (down, code) => {
  const k = KEYS[(game.keys && game.keys[code]) || code];
  if (k === undefined || !Module._executor_key) return false;
  startAudio();
  Module._executor_key(down ? 1 : 0, k);
  return true;
};
for (const type of ['keydown', 'keyup']) {
  canvas.addEventListener(type, (e) => {
    if (type === 'keydown' && e.repeat) { if (KEYS[e.code] !== undefined) e.preventDefault(); return; }
    if (macKey(type === 'keydown', e.code)) e.preventDefault();
  });
}

// Bundles over 50 MB are split into parts (scripts/package-executor-game.sh).
let dataURL = null;
async function joinParts(parts) {
  const blobs = [];
  for (const [i, p] of parts.entries()) {
    status.textContent = `Downloading part ${i + 1} of ${parts.length}…`;
    const r = await fetch('games/' + gameId + '.data.' + p);
    if (!r.ok) throw new Error(r.status + ' ' + r.url);
    blobs.push(await r.blob());
  }
  return URL.createObjectURL(new Blob(blobs));
}

if (!game) {
  status.textContent = 'Unknown game: ' + gameId;
} else {
  (async () => {
    if (game.parts) dataURL = await joinParts(game.parts);
    for (const src of ['games/' + gameId + '.js?v=' + BUILD, 'executor.js?v=' + BUILD]) {
      const s = document.createElement('script');
      s.src = src; s.async = false;
      document.body.appendChild(s);
    }
  })().catch((e) => { status.textContent = 'Download failed: ' + e.message; });
}
</script>
</body>
</html>
