<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Mac Games</title>
<meta name="description" content="Classic 68k Macintosh games running in the browser on Executor compiled to WebAssembly.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fff; --ink: #000; --desk-a: #fff; --desk-b: #000; --muted: #444;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #000; --ink: #e8e8e8; --desk-a: #2a2a2a; --desk-b: #000; --muted: #aaa; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #000; --ink: #e8e8e8; --desk-a: #2a2a2a; --desk-b: #000; --muted: #aaa; color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; }
  body {
    font: 16px/1.35 Chicago, ChicagoFLF, "Pixelify Sans", Geneva, system-ui, sans-serif;
    color: var(--ink);
    /* the 50% gray dither of the original desktop */
    background: var(--desk-a);
    background-image: conic-gradient(var(--desk-b) 25%, var(--desk-a) 0 50%, var(--desk-b) 0 75%, var(--desk-a) 0);
    background-size: 4px 4px;
    image-rendering: pixelated;
  }
  a { color: inherit; }

  /* menu bar */
  .menubar {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: stretch; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--ink);
    height: 28px; padding: 0 8px;
    overflow-x: auto; scrollbar-width: none; white-space: nowrap;
  }
  .menubar::-webkit-scrollbar { display: none; }
  .menubar a, .menubar button {
    display: flex; align-items: center; padding: 0 10px;
    font: inherit; color: inherit; text-decoration: none;
    background: none; border: 0; cursor: pointer;
  }
  .menubar a:hover, .menubar a:focus-visible, .menubar a[aria-current], .menubar button:hover {
    background: var(--ink); color: var(--paper); outline: none;
  }
  .menubar .spacer { flex: 1; }
  .menubar svg { width: 18px; height: 18px; }

  /* windows */
  main { padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .window {
    width: 100%; max-width: 820px;
    background: var(--paper); border: 1px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
  }
  .titlebar {
    position: relative; height: 22px; border-bottom: 1px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(var(--paper) 0 3px, var(--ink) 3px 4px) 0 2px / 100% calc(100% - 4px) no-repeat, var(--paper);
  }
  .titlebar h1, .titlebar h2 {
    margin: 0; padding: 0 8px; font-size: 16px; font-weight: 600;
    background: var(--paper); line-height: 22px;
    max-width: calc(100% - 64px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .closebox {
    position: absolute; left: 8px; top: 5px; width: 13px; height: 12px;
    border: 1px solid var(--ink); background: var(--paper); display: block;
    box-shadow: 0 0 0 2px var(--paper);
  }
  .content { padding: 16px; }
  .content p { margin: 0 0 12px; }
  .content p:last-child { margin-bottom: 0; }
  .muted { color: var(--muted); }

  /* game list */
  .icons { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px 8px; }
  .icons a { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; padding: 6px 4px; gap: 4px; }
  .icons svg { width: 48px; height: 48px; }
  .icons .name { padding: 0 4px; font-weight: 600; }
  .icons a:hover .name, .icons a:focus-visible .name { background: var(--ink); color: var(--paper); }
  .icons a:focus-visible { outline: none; }
  .icons a:hover svg, .icons a:focus-visible svg { filter: invert(1); }
  .icons .meta { font-size: 13px; color: var(--muted); }

  /* player */
  .screen { display: block; width: 100%; border: 0; background: #000; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 12px; }
  dt { font-weight: 600; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .note { border: 1px dotted var(--ink); padding: 8px 12px; font-size: 14px; }
  @media (max-width: 520px) {
    main { padding: 16px 16px 32px; }
    dl { grid-template-columns: 1fr; gap: 0; }
    dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<nav class="menubar" id="menubar" aria-label="Games">
  <a href="#" title="All games" aria-label="All games"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 1h10v1H3zM2 2h1v11H2zM13 2h1v11h-1zM4 3h8v1H4zM4 4h1v5H4zM11 4h1v5h-1zM4 9h8v1H4zM6 5h1v1H6zM9 5h1v1H9zM6 7h4v1H6zM2 13h12v1H2zM3 14h10v1H3zM9 11h3v1H9z"/></svg></a>
</nav>
<main id="main"></main>
<script>
const REPO = 'https://github.com/statico/classic-mac';
// Screen sizes match the --size and --bpp args in executor/index.html.
// keys: the game needs a keyboard. mb: rough download size.
const GAMES = [
  { id: 'scarab-of-ra', w: 640, h: 480, keys: true, mb: 13 },
  { id: 'dark-castle', w: 640, h: 480, keys: true, mb: 14 },
  { id: 'oregon-trail', w: 640, h: 480, keys: false, mb: 14 },
  { id: 'shufflepuck-cafe', w: 640, h: 480, keys: false, mb: 14 },
  { id: 'simcity-2000', w: 640, h: 480, keys: false, mb: 17 },
  { id: 'glider-pro', w: 640, h: 480, keys: true, mb: 19 },
  { id: 'ev-nova', w: 800, h: 600, keys: true, mb: 185 },
];
const main = document.getElementById('main');
const menubar = document.getElementById('menubar');
let credits = {};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const win = (title, body, cls = '', tag = 'h2') =>
  `<section class="window ${cls}"><div class="titlebar"><a class="closebox" href="#" aria-label="Close"></a><${tag}>${esc(title)}</${tag}></div><div class="content">${body}</div></section>`;
const disk = '<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 1h13v1H1zM1 2h1v13H1zM14 2h1v13h-1zM2 14h12v1H2zM4 2h1v4H4zM11 2h1v4h-1zM5 5h6v1H5zM8 2h2v3H8zM3 8h10v1H3zM3 9h1v5H3zM12 9h1v5h-1zM5 10h6v1H5zM5 12h6v1H5z"/></svg>';

const DISCLAIMER = `These applications are the property of their respective owners. They are here for archival and historical purposes only. If you own the rights to one of them and want it removed, <a href="${REPO}/issues">open an issue</a> and we will remove it.`;

function home() {
  document.title = 'Classic Mac Games';
  const list = GAMES.map((g) => {
    const c = credits[g.id] || {};
    return `<li><a href="#${g.id}">${disk}<span class="name">${esc(c.title || g.id)}</span><span class="meta">${esc(c.year || '')} · ${esc((c.authors || []).join(', '))}</span></a></li>`;
  }).join('');
  main.innerHTML =
    win('Classic Mac Games', `<p>Seven classic 68k Macintosh games that run in your browser. There is no Mac ROM and no Mac system software: <a href="https://github.com/autc04/executor">Executor</a> reimplements the Mac Toolbox and is compiled to WebAssembly.</p><ul class="icons">${list}</ul>`, '', 'h1') +
    win('About', `<p><a href="${REPO}#readme">How it works</a> · <a href="${REPO}">Source code</a></p><p>All the games come from the <a href="https://macintoshgarden.org/">Macintosh Garden</a>, which keeps abandoned Mac software available. Each game page names its authors and links to its Garden page.</p><p class="note">${DISCLAIMER}</p>`);
}

function play(g) {
  const c = credits[g.id] || {};
  document.title = (c.title || g.id) + ' · Classic Mac Games';
  const by = (c.authors || []).join(', ');
  main.innerHTML =
    win(c.title || g.id, `<iframe class="screen" src="executor/?game=${g.id}" title="${esc(c.title || g.id)}" style="aspect-ratio: ${g.w} / ${g.h + 26}" allow="autoplay; fullscreen"></iframe>`)
      .replace('class="window ', `style="max-width: ${g.w + 2}px" class="window `).replace('class="content"', 'class="content" style="padding:0"') +
    win('Get Info', `
      <dl>
        <dt>Title</dt><dd>${esc(c.title || g.id)} ${esc(c.version || '')}</dd>
        <dt>By</dt><dd>${esc(by)}</dd>
        <dt>Publisher</dt><dd>${esc(c.publisher || '')}, ${esc(c.year || '')}</dd>
        <dt>Source</dt><dd><a href="${esc(c.garden_url || '#')}">${esc(c.garden_page_title || 'Macintosh Garden')}</a><br><span class="muted">${esc(c.download_file || '')}</span></dd>
        <dt>Download</dt><dd>about ${g.mb} MB, the emulator included</dd>
        <dt>Controls</dt><dd>${g.keys ? 'Mouse and keyboard. On a phone, you can watch but you cannot play.' : 'Mouse only. A tap is a click.'}</dd>
      </dl>
      <p>${esc(c.description || '')}</p>
      <p class="note">${DISCLAIMER}</p>`);
  main.querySelector('iframe').focus();
}

function route() {
  const id = location.hash.slice(1);
  const g = GAMES.find((x) => x.id === id);
  for (const a of menubar.querySelectorAll('a[data-id]'))
    a.toggleAttribute('aria-current', a.dataset.id === id);
  g ? play(g) : home();
  window.scrollTo(0, 0);
}

fetch('credits.json').then((r) => r.json()).catch(() => ({})).then((c) => {
  credits = c;
  menubar.insertAdjacentHTML('beforeend',
    GAMES.map((g) => `<a href="#${g.id}" data-id="${g.id}">${esc((c[g.id] || {}).title || g.id)}</a>`).join('') +
    `<span class="spacer"></span><a href="${REPO}#readme">How it works</a>`);
  addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
